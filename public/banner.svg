<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="40%"  stop-color="#12082a"/>
      <stop offset="100%" stop-color="#0a0a1f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a61f6"/>
      <stop offset="50%"  stop-color="#c040c0"/>
      <stop offset="100%" stop-color="#f97f1b"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a61f6" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7a61f6" stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#c040c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97f1b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a61f6"/>
      <stop offset="100%" stop-color="#c040c0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="280" fill="url(#bgGrad)" rx="16" ry="16"/>
  <g opacity="0.04" stroke="#7a61f6" stroke-width="1">
    <line x1="0" y1="40"  x2="960" y2="40"/><line x1="0" y1="80"  x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="200" x2="960" y2="200"/><line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="40"  y1="0" x2="40"  y2="280"/><line x1="80"  y1="0" x2="80"  y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/><line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/><line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/><line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/><line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/><line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="520" y1="0" x2="520" y2="280"/><line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/><line x1="640" y1="0" x2="640" y2="280"/>
    <line x1="680" y1="0" x2="680" y2="280"/><line x1="720" y1="0" x2="720" y2="280"/>
    <line x1="760" y1="0" x2="760" y2="280"/><line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="840" y1="0" x2="840" y2="280"/><line x1="880" y1="0" x2="880" y2="280"/>
    <line x1="920" y1="0" x2="920" y2="280"/>
  </g>
  <ellipse cx="200" cy="140" rx="160" ry="100" fill="#7a61f6" opacity="0.06"/>
  <ellipse cx="760" cy="140" rx="160" ry="100" fill="#c040c0" opacity="0.06"/>
  <ellipse cx="480" cy="60"  rx="200" ry="60"  fill="#8040e0" opacity="0.05"/>
  <rect width="960" height="280" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" rx="16" ry="16" opacity="0.5"/>
  <!-- App Icon placeholder (F letter) -->
  <g transform="translate(52, 80)">
    <rect x="0" y="0" width="120" height="120" rx="28" ry="28" fill="#7a61f6" opacity="0.3"/>
    <rect x="0" y="0" width="120" height="120" rx="28" ry="28" fill="none" stroke="url(#titleGrad)" stroke-width="2"/>
    <text x="60" y="82" text-anchor="middle" font-family="'Segoe UI', Arial Black, sans-serif"
          font-size="72" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)">F</text>
  </g>
  <rect x="49" y="77" width="126" height="126" rx="31" ry="31" fill="none"
        stroke="url(#titleGrad)" stroke-width="2" opacity="0.7"/>
  <text x="220" y="122" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
        font-size="64" font-weight="900" letter-spacing="8"
        fill="url(#titleGrad)" filter="url(#glow)">FLIXORA</text>
  <text x="222" y="154" font-family="'Segoe UI', Arial, sans-serif"
        font-size="15.5" fill="#b0a0d0" letter-spacing="1.5">
    🎬 Anime · Movies · TV Shows · Android APK
  </text>
  <rect x="220" y="168" width="560" height="2" rx="1" fill="url(#glowLine)" opacity="0.8"/>
  <g transform="translate(222, 186)" filter="url(#softGlow)">
    <rect x="0" y="0" width="198" height="48" rx="24" fill="#7a61f6" opacity="0.25"/>
    <rect x="0" y="0" width="198" height="48" rx="24" fill="url(#btnGrad)"/>
    <rect x="0" y="0" width="198" height="48" rx="24" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
    <text x="99" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="16" font-weight="700" fill="white" letter-spacing="0.5">Download APK</text>
  </g>
  <g transform="translate(432, 186)">
    <rect x="0" y="0" width="120" height="48" rx="24" fill="none" stroke="#7a61f6" stroke-width="1.5" opacity="0.7"/>
    <rect x="0" y="0" width="120" height="48" rx="24" fill="#7a61f6" opacity="0.12"/>
    <text x="60" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="10" fill="#a090d0" letter-spacing="1">LATEST</text>
    <text x="60" y="36" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="14" font-weight="700" fill="#c0a8ff">GitHub Release</text>
  </g>
  <g transform="translate(564, 186)">
    <rect x="0" y="0" width="100" height="48" rx="24" fill="none" stroke="#3DDC84" stroke-width="1.5" opacity="0.6"/>
    <rect x="0" y="0" width="100" height="48" rx="24" fill="#3DDC84" opacity="0.08"/>
    <text x="50" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="10" fill="#3DDC84" letter-spacing="1">PLATFORM</text>
    <text x="50" y="36" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="14" font-weight="700" fill="#3DDC84">Android 5+</text>
  </g>
  <rect x="0" y="276" width="960" height="4" rx="2" fill="url(#glowLine)" opacity="0.6"/>
  <circle cx="830" cy="45"  r="1.5" fill="#c0a8ff" opacity="0.7"/>
  <circle cx="860" cy="90"  r="1"   fill="#f97f1b" opacity="0.5"/>
  <circle cx="900" cy="55"  r="2"   fill="#7a61f6" opacity="0.5"/>
  <circle cx="880" cy="130" r="1"   fill="#c040c0" opacity="0.4"/>
  <circle cx="920" cy="100" r="1.5" fill="#c0a8ff" opacity="0.3"/>
  <circle cx="840" cy="160" r="1"   fill="#f97f1b" opacity="0.4"/>
  <circle cx="810" cy="80"  r="1.2" fill="#3DDC84" opacity="0.4"/>
</svg>
