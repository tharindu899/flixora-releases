<svg width="280" height="64" viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a61f6"/>
      <stop offset="100%" stop-color="#c040c0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="280" height="64" rx="32" fill="#7a61f6" opacity="0.2"/>
  <rect x="0" y="0" width="280" height="64" rx="32" fill="url(#btnGrad)" filter="url(#glow)"/>
  <rect x="0" y="0" width="280" height="64" rx="32" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <text x="140" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="18" font-weight="700" fill="white" letter-spacing="0.5">Download APK</text>
</svg>
